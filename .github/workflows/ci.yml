name: UEFI Guest CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: >-
    uefi-guest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uefi_guest:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UEFI guest · VMX
            case: uefi-disk-vmx
            runs_on: [self-hosted, linux, intel, kvm]
          - name: UEFI guest · SVM
            case: uefi-disk-svm
            runs_on: [self-hosted, linux, amd, kvm]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare KVM and UEFI inputs
        run: |
          set -euo pipefail
          command -v rustc
          command -v cargo
          command -v gzip
          rustc -vV
          cargo -V
          test -r /dev/kvm && test -w /dev/kvm

          disk_asset=test-suit/axvisor/experimental/qemu-uefi-disk/assets/uefi-guest.img.gz
          disk_image=/tmp/uefi-guest.img
          test -s "${disk_asset}"
          gzip -dc "${disk_asset}" > "${disk_image}"
          disk_size=$(stat -c '%s' "${disk_image}")
          test $((disk_size % 512)) -eq 0
          echo "Prepared UEFI guest disk: ${disk_image} (${disk_size} bytes)"

          ovmf_dir=test-suit/axvisor/experimental/qemu-uefi-disk/assets
          test -r "${ovmf_dir}/OVMF_CODE_4M.fd"
          test -r "${ovmf_dir}/OVMF_VARS_4M.fd"

      - name: Pull Linux guest image
        run: cargo xtask image pull qemu-x86_64 --extract-dir tmp/axbuild/images

      - name: Run UEFI guest test
        run: >-
          cargo xtask axvisor test qemu --arch x86_64
          --test-group experimental --test-case ${{ matrix.case }}
